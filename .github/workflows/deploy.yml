name: CI build check

# The live site ssvnauka.com (CNAME) is served from the static gh-pages branch.
# The Next.js app on main uses Prisma/NextAuth and is deployed by Vercel, so it
# cannot be published to GitHub Pages (there is no static export / out dir).
# This workflow only verifies that main builds and never publishes anything,
# so it cannot overwrite the live gh-pages site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
